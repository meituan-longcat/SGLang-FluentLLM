[build-system]
requires = ["setuptools==69.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluentllm"
version = "0.0.1"
description = "FluentLLM is fast serving framework for large language models."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = ["requests", "tqdm", "numpy", "IPython", "setproctitle"]

[project.optional-dependencies]
runtime_common = [
    "aiohttp",
    "pybind11",
    "decord",
    "fastapi",
    "hf_transfer",
    "huggingface_hub",
    "modelscope",
    "msgspec",
    "orjson",
    "packaging",
    "pillow",
    "prometheus-client>=0.20.0",
    "psutil",
    "pydantic",
    "py-spy",
    "python-multipart",
    "pyzmq>=25.1.2",
    "torchao>=0.7.0",
    "uvicorn",
    "uvloop==0.21.0",
    "ninja",
    "transformers==4.56.2",
    "xgrammar==0.2.8",
    # xgrammar 0.2.x 走 apache-tvm-ffi;tilelang 的约束(~=0.1.0)太松会让 pip 解析回 0.1.12,
    # 而 0.1.12 的 registry 属性反射与 tilelang 内置 TVM 不兼容(import 时 AttributeError)。钉在 0.1.11。
    "apache-tvm-ffi==0.1.11",
    "openai==1.99.1",
    "cuda-bindings==12.9.0",
    "setuptools-scm==8.2.0",
    "urllib3==1.26.6",
    "pybase64",
    "scikit_build_core",
    "uv",
    "compressed-tensors==0.12.2",
    "partial-json-parser==0.2.1.1.post6",
    "dill==0.4.0",
    "nvidia-ml-py==13.580.82",
    "einops",
    "torch-memory-saver==0.0.9"
]
srt = [
    "fluentllm[runtime_common]",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "cuda-python==12.9.0",
    "cuda-bindings==12.9.0",
]
test = [
    "jsonlines",
    "matplotlib",
    "pandas",
    "sentence_transformers",
    "accelerate",
    "peft",
]

all = ["fluentllm[srt]"]

dev = ["fluentllm[all]", "fluentllm[test]"]

cuda_sm80 = [
    "fluentllm[dev]",
]

cuda_sm90 = [
    "fluentllm[dev]",
    "flash_attn_3",
    "aok_sfa",
]

[project.urls]
"Homepage" = "https://github.com/meituan-longcat/SGLang-FluentLLM"

[tool.setuptools.package-data]
"fluentllm" = [
    "srt/layers/moe/fused_moe_triton/configs/*.json",
    "srt/layers/quantization/configs/*.json",
    "jit_kernel/include/sgl_kernel/*.h",
    "jit_kernel/include/sgl_kernel/*.cuh",
    "jit_kernel/csrc/*.cuh"
]

[tool.setuptools.packages.find]
exclude = [
    "assets*",
    "benchmark*",
    "docs*",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
]

[tool.wheel]
exclude = [
    "assets*",
    "benchmark*",
    "docs*",
    "dist*",
    "playground*",
    "scripts*",
    "tests*",
]

# ============================================================
# Ruff 配置：同时承担 静态代码检查（lint） 与 代码风格检查（format）
# 文档：https://docs.astral.sh/ruff/
# ============================================================
[tool.ruff]
# 单行最大长度，超过会被 lint 规则 E501 标记
line-length = 150
# 目标 Python 版本，影响语法检查与自动修复建议
target-version = "py39"
# 需要排除检查的目录/文件
exclude = [
    ".git",
    ".github",
    "benchmark",
    "build",
    "3rdparty",
    "assets",
    "docs",
    "npu_test",
    "examples",
    "test",
    "sglang/srt/sampling/penaltylib",
    "sglang/srt/layers/quantization",
    "sglang/srt/layers/moe/executors",
    "sglang/srt/layers/moe/gemms",
    "sglang/srt/layers/moe/layouts",
    "sglang/srt/layers/dense/gemms",
    "sglang/srt/layers/dense/layouts",
    "sglang/srt/layers/attention/fla", 
    "sglang/srt/distributed/device_communicators",
]

[tool.ruff.lint]
# 启用的规则集：
# E/W  - pycodestyle（PEP8 风格问题）
# F    - Pyflakes（未使用导入/变量、语法问题等）
# I    - isort（import 排序）
# B    - flake8-bugbear（潜在 bug，如可变默认参数、裸 except）
# C90  - mccabe（圈复杂度）
# N    - pep8-naming（命名规范）
# UP   - pyupgrade（使用更现代的 Python 语法）
# S    - flake8-bandit（安全问题，如 md5、pickle）
# SIM  - flake8-simplify（可简化的代码写法）
select = ["E", "W", "F", "I", "B", "C90", "N", "UP", "S", "SIM"]

# 按需忽略的规则（示例：S101 允许使用 assert），每个忽略规则项都要给出解释和理由。
ignore = [
    # N806/N803: 在深度学习/张量运算代码中，大写变量名（如 B, H, D 表示 batch/head/dim 维度）是广泛采用的惯例，不适合强制小写，否则严重影响可读性。
    "N806",
    "N803",
    # S607: 可执行文件路径（如 "nvidia-smi"、"rocm-smi"）启动子进程。调用系统自带的 GPU/CPU 检测工具，依赖 PATH 查找是常见且可接受的做法，写死绝对路径反而降低可移植性，故忽略该规则。
    "S607",
    # B027: 抽象基类中允许存在“空方法但未加 @abstractmethod”的可选钩子（optional hook），用于给子类提供默认的空实现/默认值，子类可按需覆盖，这是项目中广泛使用的合理设计模式。
    "B027",
    # N812: `import torch.nn.functional as F` 是 PyTorch/深度学习生态中广泛采用的惯例写法。
    "N812",
    # F403: 项目中部分 __init__.py 使用 `from x import *` 做兼容性的整体重导出，属于有意为之的设计（避免大规模改动仓库内所有导入路径），因此全局忽略该规则。
    "F403",
    # B024: 项目中广泛使用“工厂式抽象基类”模式（如通过 create/init_new 静态方法，返回不同子类实例），基类本身仅作为接口占位，并不强制要求抽象方法。
    "B024",  
    # C901: 圈复杂度检查。推理引擎中调度器、attention/MoE 等核心逻辑天然涉及大量分支（多种量化/并行/硬件后端组合），强行拆分函数往往会牺牲可读性和局部性。
    "C901",
    # SIM108: 建议将 if/else 赋值语句改写为三元表达式。强制三元表达式会降低可读性和可扩展性，故不做该项自动化整改。
    "SIM108",
    # SIM102: 建议合并嵌套的 if 语句（collapsible-if）。代码中大量嵌套 if 是为了分层校验前置条件，合并后条件表达式过长反而不利于阅读和调试，故不启用该项检查。
    "SIM102",
    "S608",
    # S101: 禁止使用 assert 语句。项目中 assert 大量用于开发期断言，符合社区的通行做法，故忽略该规则；测试代码也已在 per-file-ignores 中单独放开。
    "S101",
    # 注意：除非必要，尽量不要再新增忽略规则项了
]

# 允许 --fix 自动修复的规则范围（默认所有 select 中支持自动修复的规则都会修复）
fixable = ["ALL"]

# 圈复杂度阈值，超过会触发 C901
[tool.ruff.lint.mccabe]
max-complexity = 10

# 每个文件/目录的规则例外
[tool.ruff.lint.per-file-ignores]
# 测试文件中允许使用 assert，且不强制安全检查
"test/*" = ["S101"]

[tool.ruff.lint.pep8-naming]
# 类方法/函数命名规范可按需扩展

[tool.ruff.format]
# 使用双引号，风格与 black 保持一致
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
